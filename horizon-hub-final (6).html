/* ---------- safe persistence (localStorage with in-memory fallback) ---------- */
const mem = {};
const store = {
  get(k) { try { const v = window.localStorage.getItem(k); return v == null ? mem[k] : v; } catch (e) { return mem[k]; } },
  set(k, v) { mem[k] = v; try { window.localStorage.setItem(k, v); } catch (e) {} },
};
const INIT = { hp: 0, streak: 0, last: "", refs: [], code: "", shop: {}, light: false, tickets: 0, boostUntil: 0, spinDay: "", skinOn: true, q: { day: "", p: {}, c: {} }, ach: {}, codeDay: "", stake: { amt: 0, since: 0 }, gdHigh: 0, aliens: [], items: [], active: -1, eq: {}, welcomed: false, bt: { day: "", ec: 0, sr: 0 }, bw: { w: 0, l: 0, d: 0 }, rm: false, skins: [], rskin: "std" };
function usePersist(k, init) {
  const [v, setV] = useState(() => { try { const s = store.get(k); return s ? { ...init, ...JSON.parse(s) } : init; } catch (e) { return init; } });
  useEffect(() => { store.set(k, JSON.stringify(v)); }, [k, v]);
  return [v, setV];
}

/* ---------- procedural art (SVG strings reused in DOM and canvas) ---------- */
function asteroidSVG(seed = 1) {
  const r = rng(seed * 977 + 13), n = 11;
  let d = "", c = "";
  for (let i = 0; i < n; i++) { const a = (i / n) * 6.283, q = 34 + r() * 14; d += (i ? "L" : "M") + (50 + Math.cos(a) * q).toFixed(1) + " " + (50 + Math.sin(a) * q).toFixed(1); }
  d += "Z";
  for (let i = 0; i < 5; i++) { const x = 28 + r() * 44, y = 28 + r() * 44, q = 4 + r() * 8; c += `<circle cx="${x}" cy="${y}" r="${q}" fill="#000" opacity=".3"/><circle cx="${x - q * 0.2}" cy="${y - q * 0.2}" r="${q * 0.8}" fill="none" stroke="#fff" stroke-opacity=".2"/>`; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="g${seed}" cx=".33" cy=".3" r=".8"><stop offset="0" stop-color="#c2b19f"/><stop offset=".5" stop-color="#6e5f55"/><stop offset="1" stop-color="#1b1511"/></radialGradient><filter id="n${seed}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="${seed}"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .45 0 0 0 1.2 -.35"/></filter><clipPath id="c${seed}"><path d="${d}"/></clipPath></defs><g clip-path="url(#c${seed})"><rect width="100" height="100" fill="url(#g${seed})"/><rect width="100" height="100" filter="url(#n${seed})" opacity=".55"/>${c}</g><path d="${d}" fill="none" stroke="#f0e0cc" stroke-opacity=".4"/></svg>`;

/* ---------- Daily Streak ---------- */
function Streak({ S, setS, add, track }) {
  const t = today(), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10), claimed = S.last === t;
  const reached = S.streak ? ((S.streak - 1) % 7) + 1 : 0;
  const claim = () => { if (claimed) return; const st = S.last === y ? S.streak + 1 : 1, r = 10 + Math.min(st, 7) * 5; setS((s) => ({ ...s, streak: st, last: t })); add(r, `Day ${st} streak · +${r} HP`); track("streak"); };
  return (
    <Sec icon="cal" title="Daily Streak Bonus">
      <p className="mu">Visit every day to grow your streak and your reward. Current streak: <b>{S.streak} day{S.streak === 1 ? "" : "s"}</b></p>
      <div className="days">{Array.from({ length: 7 }, (_, i) => <div key={i} className={"day" + (i < reached ? " on" : "")}>{i === 6 ? <Chest s={36} /> : <Coin s={34} />}<small>Day {i + 1}</small></div>)}</div>
      <button className="btn pri" onClick={claim} disabled={claimed}>{claimed ? "Claimed · come back tomorrow" : "Claim daily reward"}</button>
    </Sec>
  );
}

function useNow(ms = 15000) { const [n, setN] = useState(Date.now()); useEffect(() => { const i = setInterval(() => setN(Date.now()), ms); return () => clearInterval(i); }, [ms]); return n; }
const hm = (ms) => `${Math.floor(ms / 36e5)}h ${Math.floor((ms % 36e5) / 6e4)}m`;
const ITEMS = [
  ["ticket", "Lucky Spin Ticket", "One extra spin on the Lucky Wheel", 60, "ticket"],
  ["vip", "VIP Glow Border", "Animated neon rainbow border on your profile card", 200, "crown"],

  ["skin", "Gold Fighter Skin", "Gold and neon fighter for Cosmic Dodger", 250, "nav"],
  ["sfx", "Sound Pack", "Arcade sound effects on every tap", 100, "speaker"],
  ["synth", "Synthwave Track", "Unlocks the locked radio track", 150, "keys"],
  ["light", "Light Mode", "Switch the whole hub to a light theme", 80, "sun"],
];
function Shop({ S, setS, toast }) {
  const now = useNow();
  const buy = (it) => {
    if (S.hp < it[3]) return toast(`Need ${it[3]} HP`);
    setS((s) => { if (s.hp < it[3]) return s; const n = { ...s, hp: s.hp - it[3] }; if (it[0] === "ticket") n.tickets = s.tickets + 1; else if (it[0] === "boost") n.boostUntil = Date.now() + 864e5; else { n.shop = { ...s.shop, [it[0]]: true }; if (it[0] === "skin") n.skinOn = true; } return n; });
    toast(`${it[1]} purchased`);
  };
  const ctl = (it) => {
    const id = it[0], price = <button className="btn" onClick={() => buy(it)}><Coin s={22} />{it[3]} HP</button>;
    if (id === "ticket") return <>{S.tickets > 0 && <span className="own">Owned ×{S.tickets}</span>}{price}</>;
    if (id === "boost") return S.boostUntil > now ? <span className="own">Active · {hm(S.boostUntil - now)} left</span> : price;
    if (!S.shop[id]) return price;
    if (id === "light") return <><span className="own">Owned</span><button className="btn" onClick={() => setS((s) => ({ ...s, light: !s.light }))}>{S.light ? "Dark" : "Light"}</button></>;
    if (id === "skin") return <><span className="own">Owned</span><button className="btn" onClick={() => setS((s) => ({ ...s, skinOn: !s.skinOn }))}>{S.skinOn ? "Equipped" : "Equip"}</button></>;

        </div>))}
    </Sec>
  );
}

const NTFY = "https://ntfy.sh";
const SITE_URL = ""; // set to your published site URL, e.g. "https://yoursite.com" (referral links need a public address)
function Referral({ S, setS, toast }) {
  const seen = useRef(new Set(S.refs));
  const link = (SITE_URL || (typeof window !== "undefined" ? window.location.href.split(/[?#]/)[0] : "")) + "?ref=" + S.code;
  useEffect(() => {
    if (!S.code) return; let es;
    try {
      es = new EventSource(`${NTFY}/hrzn-ref-${S.code}/sse?since=all`);
      es.onmessage = (e) => { try { const d = JSON.parse(e.data); if (d.event !== "message") return; const id = String(d.message).slice(0, 12); if (!/^HRZN[A-Z0-9]{3,6}$/.test(id) || id === S.code || seen.current.has(id)) return; seen.current.add(id); setS((s) => ({ ...s, refs: [...s.refs, id], hp: s.hp + 30 })); toast("New referral joined · +30 HP"); } catch (x) {} };
    } catch (x) {}
    return () => es && es.close();
  }, [S.code]);
  const copy = async () => { try { await navigator.clipboard.writeText(link); toast("Link copied"); } catch (e) { toast("Select the link and copy it"); } };
  return (
    <Sec icon="link" title="Referral Program">

  );
}

const CHAT_TOPIC = "hrzn-moggdog-chat-v1"; // public ntfy.sh topic. Change it to something unique to your community
function Shoutbox({ S, setS, toast, track }) {
  const [lines, setLines] = useState([]), [v, setV] = useState(""), [st, setSt] = useState("connecting");
  const box = useRef(), seen = useRef(new Set()), last = useRef(0), me = useRef(""); me.current = S.code;

  useEffect(() => {

      es = new EventSource(`${NTFY}/${CHAT_TOPIC}/sse?since=6h`);

      es.onmessage = (e) => { try {
        const d = JSON.parse(e.data); if (d.event !== "message" || seen.current.has(d.id)) return; seen.current.add(d.id);
        const p = JSON.parse(d.message); if (typeof p.u !== "string" || typeof p.m !== "string") return;
        setLines((l) => [...l.slice(-79), { id: d.id, u: p.u.slice(0, 16), m: p.m.slice(0, 160).replace(/https?:\/\/\S+|www\.\S+/gi, "[link removed]"), t: new Date(d.time * 1000).toTimeString().slice(0, 5), me: p.c === me.current }]);
      } catch (x) {} };
    } catch (x) { setSt("offline"); }
    return () => es && es.close();
  }, []);
  useEffect(() => { if (box.current) box.current.scrollTop = box.current.scrollHeight; }, [lines]);
  const send = async () => {
    const m = v.trim(); if (!m) return; if (Date.now() - last.current < 2500) return toast("Slow down a little");

    catch (x) { setV(m); toast("Message failed to send. Check your connection"); }
  };
  return (
    <Sec icon="chat" title="Live Community Chat">
      <div className="term">horizon@chat:~$ {st === "live" ? "online" : st === "connecting" ? "connecting..." : "offline, retrying..."}</div>
      <div className="log" ref={box}>{lines.length === 0 && <div>{st === "offline" ? "Can't reach the chat server right now." : "No messages yet. Say gm!"}</div>}{lines.map((l) => <div key={l.id} className={l.me ? "me" : ""}>[{l.t}] &lt;{l.u}&gt; {l.m}</div>)}</div>
      <div className="lr"><input value={S.nick || ""} maxLength={16} placeholder={"Nickname (" + nick + ")"} onChange={(e) => setS((s) => ({ ...s, nick: e.target.value.replace(/[^\w\- ]/g, "") }))} aria-label="Nickname" /></div>

/* ---------- Radio ---------- */
function Radio({ S, toast }) {
  const [cur, setCur] = useState(null); const A = useRef({}); const bars = useRef([]);
  const stop = () => { clearInterval(A.current.t); A.current.on = false; setCur(null); };

    loop();
    return () => { cancelAnimationFrame(raf); clearInterval(A.current.t); try { A.current.ac && A.current.ac.close(); } catch (e) {} };
  }, []);
